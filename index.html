    // --- HTML5 GPU-Accelerated Antigravity Canvas Background ---
    const AntigravityCanvas = () => {
      const canvasRef = useRef(null);
      const mouseRef = useRef({ x: 0, y: 0, active: false });

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationId;
        let particles = [];
        
        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Particle generator
        const particleCount = Math.min(Math.floor(window.innerWidth / 15), 90);
        
        class CanvasParticle {
          constructor() {
            this.reset(true);
          }

          reset(initial = false) {
            this.x = Math.random() * canvas.width;
            this.y = initial ? Math.random() * canvas.height : canvas.height + 50;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = -(Math.random() * 0.5 + 0.2); // Slow upward float
            this.size = Math.random() * 2 + 1;
            this.alpha = Math.random() * 0.5 + 0.2;
            this.maxAlpha = this.alpha;
            this.type = Math.random() > 0.85 ? 'element' : 'sparkle'; 
            this.angle = Math.random() * Math.PI * 2;
            this.spinSpeed = (Math.random() - 0.5) * 0.02;
            this.elementType = ['needle', 'button', 'flower'][Math.floor(Math.random() * 3)];
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;
            this.angle += this.spinSpeed;

            // Float oscillation
            this.x += Math.sin(this.angle * 0.1) * 0.05;

            // Mouse interaction (repulsion)
            if (mouseRef.current.active) {
              const dx = this.x - mouseRef.current.x;
              const dy = this.y - mouseRef.current.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 150) {
                const force = (150 - dist) / 150;
                this.x += (dx / dist) * force * 1.5;
                this.y += (dy / dist) * force * 1.5;
              }
            }

            // Boundary wrap
            if (this.y < -50 || this.x < -50 || this.x > canvas.width + 50) {
              this.reset(false);
            }
          }

          draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.shadowBlur = this.type === 'sparkle' ? 8 : 0;
            ctx.shadowColor = '#C9A227';

            if (this.type === 'sparkle') {
              // Soft gold sparkle
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
              ctx.fillStyle = '#C9A227';
              ctx.fill();
            } else {
              // Thematic floating element
              ctx.translate(this.x, this.y);
              ctx.rotate(this.angle);
              ctx.strokeStyle = 'rgba(201, 162, 39, 0.4)';
              ctx.lineWidth = 1;

              if (this.elementType === 'needle') {
                // Needle drawing
                ctx.beginPath();
                ctx.moveTo(-15, 0);
                ctx.lineTo(15, 0);
                ctx.stroke();
                // Eye of needle
                ctx.beginPath();
                ctx.arc(10, 0, 1, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(201, 162, 39, 0.4)';
                ctx.fill();
              } else if (this.elementType === 'button') {
                // Button drawing
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.stroke();
                // 4 button holes
                const hs = 2;
                ctx.fillStyle = 'rgba(201, 162, 39, 0.3)';
                ctx.beginPath();
                ctx.arc(-hs, -hs, 0.8, 0, Math.PI * 2);
                ctx.arc(hs, -hs, 0.8, 0, Math.PI * 2);
                ctx.arc(-hs, hs, 0.8, 0, Math.PI * 2);
                ctx.arc(hs, hs, 0.8, 0, Math.PI * 2);
                ctx.fill();
              } else if (this.elementType === 'flower') {
                // Flower motif drawing (botanical embroidery shape)
                ctx.beginPath();
                for (let j = 0; j < 5; j++) {
                  ctx.rotate(Math.PI * 2 / 5);
                  ctx.arc(4, 0, 3, 0, Math.PI * 2);
                }
                ctx.stroke();
              }
            }
            ctx.restore();
          }
        }

        // Initialize particles
        for (let i = 0; i < particleCount; i++) {
          particles.push(new CanvasParticle());
        }

        // Mouse motion listener
        const handleMouseMove = (e) => {
          mouseRef.current.x = e.clientX;
          mouseRef.current.y = e.clientY;
          mouseRef.current.active = true;
        };
        const handleMouseLeave = () => {
          mouseRef.current.active = false;
        };
        const handleTouchMove = (e) => {
          if (e.touches.length > 0) {
            mouseRef.current.x = e.touches[0].clientX;
            mouseRef.current.y = e.touches[0].clientY;
            mouseRef.current.active = true;
          }
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('touchmove', handleTouchMove);

        // Core render tick
        const tick = () => {
          // Dark velvet backdrop gradient redraw
          const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
          grad.addColorStop(0, '#3A0018'); // Luxury burgundy plum
          grad.addColorStop(1, '#13000C'); // Deep black plum
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Draw ambient glow spots in corners
          ctx.beginPath();
          const radialGrad1 = ctx.createRadialGradient(0, 0, 0, 0, 0, canvas.width * 0.6);
          radialGrad1.addColorStop(0, 'rgba(122, 0, 25, 0.25)'); // Primary red
          radialGrad1.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = radialGrad1;
          ctx.arc(0, 0, canvas.width * 0.6, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          const radialGrad2 = ctx.createRadialGradient(canvas.width, canvas.height, 0, canvas.width, canvas.height, canvas.width * 0.6);
          radialGrad2.addColorStop(0, 'rgba(201, 162, 39, 0.1)'); // Secondary gold
          radialGrad2.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = radialGrad2;
          ctx.arc(canvas.width, canvas.height, canvas.width * 0.6, 0, Math.PI * 2);
          ctx.fill();

          // Render waving golden sewing thread
          ctx.save();
          ctx.strokeStyle = 'rgba(201, 162, 39, 0.09)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          let waveFreq = 0.003;
          let waveAmp = Math.max(30, canvas.width * 0.04);
          ctx.moveTo(0, canvas.height * 0.5);
          for (let x = 0; x < canvas.width; x += 10) {
            const timeOffset = Date.now() * 0.001;
            let y = canvas.height * 0.55 + Math.sin(x * waveFreq + timeOffset) * waveAmp;
            
            // Thread pulls towards mouse pointer
            if (mouseRef.current.active) {
              const dx = x - mouseRef.current.x;
              const dist = Math.abs(dx);
              if (dist < 200) {
                const pull = (200 - dist) / 200;
                y += (mouseRef.current.y - y) * pull * 0.35;
              }
            }
            ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.restore();

          // Update & Draw particles
          particles.forEach(p => {
            p.update();
            p.draw();
          });

          animationId = requestAnimationFrame(tick);
        };
        tick();

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('touchmove', handleTouchMove);
          cancelAnimationFrame(animationId);
        };
      }, []);

      return <canvas id="antigravity-bg-canvas" ref={canvasRef} />;
    };

      { id: 'ladies-pant', name: 'Ladies Pants', desc: 'Trousers, salwars, or cigarette pants tailored to fit.', time: '3 Days', image: 'Images/ladies_pant.jpg', price: '₹250–350' },
      { id: 'umbrella-gher', name: 'Umbrella Gher', desc: 'Wide-circle flowy skirts or lehengas with large flare.', time: '7 Days', image: 'Images/umbrella_gher.jpg', price: '₹800–1200' },

    // --- Main App Component ---
    const App = () => {
      const [activeSection, setActiveSection] = useState('hero');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      
      // Price category state (tabs)
      const [priceCategory, setPriceCategory] = useState('all');

      // Carousel scroll reference for Services swiper
      const carouselRef = useRef(null);

      // Track snap section active transitions
      const observerRef = useRef(null);

      useEffect(() => {

        // Intersection Observer to link active snaps to navbar links
        const observerOptions = {
          root: document.querySelector('.snap-container'),
          threshold: 0.5
        };

        observerRef.current = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              setActiveSection(entry.target.id);
            }
          });
        }, observerOptions);

        const sections = document.querySelectorAll('.snap-section');
        sections.forEach(sec => observerRef.current.observe(sec));

        // Smooth text reveal observer
        const textObserverOptions = {
          threshold: 0.1,
          rootMargin: "0px 0px -40px 0px"
        };

        const textObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
            }
          });
        }, textObserverOptions);

        const revealElements = document.querySelectorAll('.reveal-text');
        revealElements.forEach(el => textObserver.observe(el));

        return () => {
          if (observerRef.current) {
            observerRef.current.disconnect();
          }
          textObserver.disconnect();
        };
      }, []);

      // Lock snap container scroll when mobile menu is open
      useEffect(() => {
        const container = document.querySelector('.snap-container');
        if (container) {
          container.style.overflowY = mobileMenuOpen ? 'hidden' : 'auto';

      // Handle custom section click scroller
